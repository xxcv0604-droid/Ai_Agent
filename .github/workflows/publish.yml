name: Publish scheduled site

on:
  schedule:
    # 매일 UTC 15:00 = 한국시간(KST) 00:00 에 날짜를 다시 확인해서 공개
    - cron: "0 15 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site for today's release schedule
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
